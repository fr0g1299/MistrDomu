trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  clientAppPath: 'AspNetReactTemplate.Client'
  serverProjectPath: 'AspNetReactTemplate.Server/AspNetReactTemplate.Server.csproj'

steps:
  - task: UseNode@1
    inputs:
      version: '20.x'
    displayName: 'Install Node.js'

  - script: |
      cd $(clientAppPath)
      npm install
      npm run build
    displayName: 'Frontend: Build'

  - task: UseDotNet@2
    displayName: Use Dotnet 10
    inputs:
      version: "10.x"

  - script: dotnet build $(serverProjectPath)
    displayName: "Backend: Build"