name: Build and Publish Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CLIENT_APP_PATH: 'AspNetReactTemplate.Client'
  SERVER_PROJECT_PATH: 'AspNetReactTemplate.Server/AspNetReactTemplate.Server.csproj'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          cache-dependency-path: '${{ env.CLIENT_APP_PATH }}/pnpm-lock.yaml'

      - name: pnpm Install and Build (Vite)
        working-directory: ${{ env.CLIENT_APP_PATH }}
        run: |
          pnpm install
          pnpm run build

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Dotnet Clean
        run: dotnet clean ${{ env.SERVER_PROJECT_PATH }}

      - name: Dotnet Build
        run: dotnet build ${{ env.SERVER_PROJECT_PATH }}

      - name: Dotnet Publish
        run: dotnet publish ${{ env.SERVER_PROJECT_PATH }} -o publish

      - name: 'Publish Artifact: drop'
        uses: actions/upload-artifact@v4
        with:
          name: 'application'
          path: 'publish'