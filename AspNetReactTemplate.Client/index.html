<!doctype html>
<html class="scroll-smooth" lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/wrench.svg" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Stack+Sans+Notch:wght@200..700&display=swap");
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mistr Domu</title>
  </head>
  <script>
  // This script is here because of FOUC for the theme
    try {
      const theme = localStorage.getItem("ui-theme") || "system";
      const systemTheme = window.matchMedia("(prefers-color-scheme: dark)")
        .matches
        ? "dark"
        : "light";

      const effectiveTheme = theme === "system" ? systemTheme : theme;
      document.documentElement.classList.add(effectiveTheme);
    } catch (error) {
      console.error(error);
    }
  </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
